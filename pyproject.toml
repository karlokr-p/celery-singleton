[tool.poetry]
name = "celery-singleton-reboot"
version = "0.4.0"
description = "Prevent duplicate celery tasks"
authors = ["Panevo Services Ltd. <info@panevo.com>", "Steinthor Palsson <steini90@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/panevo/celery-singleton"
repository = "https://github.com/panevo/celery-singleton"
license = "MIT"
# The PyPI name differs from the import name
packages = [{ include = "celery_singleton" }]

[tool.poetry.urls]
Changelog = "https://github.com/panevo/celery-singleton/blob/master/CHANGELOG.md"
Issues = "https://github.com/panevo/celery-singleton/issues"

[tool.poetry.dependencies]
python = "^3.10"
celery = ">=4"
redis = "*"

[tool.poetry.dev-dependencies]
pytest = "*"
pytest-cov = "*"
pytest-celery = "*"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
